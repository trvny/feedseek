[project]
name = "feedseek"
version = "0.1.0"
description = "Self-updating Atom/RSS feeds for sites without native feeds. Starts with Reuters."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "curl-cffi>=0.15",
    "feedgen2>=2.0",
    "feedparser>=6.0.12",
    "lxml>=6.1.1",
    "pydantic>=2",
    "python-dateutil>=2.9.0",
    "pytz>=2026.1",
    "pyyaml>=6.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]
# Only feed_generators/discover.py needs this, and it is a manual scouting tool
# rather than part of the hourly pipeline. It is kept out of the default install
# because it pulls in uvloop, which does not build on Windows and therefore made
# a plain `uv sync` fail there for every contributor. Install with
# `uv sync --group discover` when you actually want the local crawl; without it
# discover.py falls back to the hosted feedsearch.dev API on its own.
discover = [
    "feedsearch-crawler>=0.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pylint.main]
disable = [
    # Deliberate project conventions, not defects - see feeds skill:
    "broad-exception-caught",        # per-item isolation: one bad item must not sink the run
    "import-outside-toplevel",       # a few intentionally-local imports to avoid heavy/circular deps
    "duplicate-code",                # generators intentionally copy an existing one as a template
    # Style opinions not worth enforcing on solo generator scripts:
    "missing-function-docstring",
    "missing-module-docstring",
    "logging-fstring-interpolation", # f-strings in logging calls; perf concern is irrelevant here
    # False positive: pylint misreads pytz.UTC.localize() as an unbound-method call missing `dt`
    "no-value-for-parameter",
]
max-line-length = 120
max-locals = 25
extension-pkg-allow-list = ["lxml.etree"]
