# D8 merges dex archives inside the Gradle daemon (no worker isolation), so the daemon heap is
# the dexing heap. 2 GB was already marginal and started throwing OutOfMemoryError once the unit
# test classpath grew; CI runners have far more headroom than this, so give it room.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 10 removes both opt-outs. Enforce the same build model on AGP 9.x now so
# incompatible plugins or legacy DSL usage fail before the major upgrade.
android.builtInKotlin=true
android.newDsl=true
