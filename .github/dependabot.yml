version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: /feedseek
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /feeds-proxy
    schedule: { interval: weekly }
