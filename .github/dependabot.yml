version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "21:37"
      timezone: "Europe/Warsaw"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: /
    schedule:
      interval: weekly
      time: "21:37"
      timezone: "Europe/Warsaw"
  - package-ecosystem: npm
    directory: /feeds-proxy
    schedule:
      interval: weekly
      time: "21:37"
      timezone: "Europe/Warsaw"
