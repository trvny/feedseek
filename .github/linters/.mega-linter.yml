---
# Per-linter rules live alongside this file; this file only wires MegaLinter.
FLAVOR_SUGGESTIONS: false
APPLY_FIXES: all
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false
LINTER_RULES_PATH: ".github/linters"

ADDITIONAL_EXCLUDED_DIRECTORIES:
  - ".venv"

ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - ACTION_ZIZMOR
  - HTML_DJLINT
  - HTML_HTMLHINT
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_BANDIT
  - PYTHON_BLACK
  - PYTHON_ISORT
  - PYTHON_MYPY
  - PYTHON_PYLINT
  - PYTHON_RUFF
  - REPOSITORY_TRUFFLEHOG
  - YAML_PRETTIER
  - YAML_V8R
  - YAML_YAMLLINT

ACTION_ZIZMOR_RULES_PATH: ".github/linters"
ACTION_ZIZMOR_CONFIG_FILE: "zizmor.yml"
ACTION_ZIZMOR_ARGUMENTS:
  - "--offline"
  - "--min-severity=medium"

# MegaLinter v10 does not expose a djLint CONFIG_FILE variable. djLint itself
# supports --configuration, so keep its config under .github/linters/ explicitly.
HTML_DJLINT_ARGUMENTS:
  - "--configuration"
  - ".github/linters/.djlintrc"
HTML_HTMLHINT_RULES_PATH: ".github/linters"
HTML_HTMLHINT_CONFIG_FILE: ".htmlhintrc"
MARKDOWN_MARKDOWNLINT_RULES_PATH: ".github/linters"
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: ".markdownlint.json"

PYTHON_BANDIT_RULES_PATH: ".github/linters"
PYTHON_BANDIT_CONFIG_FILE: ".bandit.yml"
PYTHON_BLACK_RULES_PATH: ".github/linters"
PYTHON_BLACK_CONFIG_FILE: "pyproject.toml"
PYTHON_ISORT_RULES_PATH: ".github/linters"
PYTHON_ISORT_CONFIG_FILE: ".isort.cfg"
PYTHON_PYLINT_RULES_PATH: ".github/linters"
PYTHON_PYLINT_CONFIG_FILE: ".pylintrc"
PYTHON_RUFF_RULES_PATH: ".github/linters"
PYTHON_RUFF_CONFIG_FILE: ".ruff.toml"

YAML_PRETTIER_RULES_PATH: ".github/linters"
YAML_PRETTIER_CONFIG_FILE: ".prettierrc.json"
YAML_YAMLLINT_RULES_PATH: ".github/linters"
YAML_YAMLLINT_CONFIG_FILE: ".yamllint.yml"

# TruffleHog 3.96 added Lob to its default detectors. In this repository it
# verifies ordinary test-function names as Lob credentials, including committed
# source, so exclude that one noisy detector while keeping the secret scan hard.
REPOSITORY_TRUFFLEHOG_ARGUMENTS:
  - "--exclude-detectors=Lob"

# Existing Pylint/Mypy findings stay visible without turning the root migration
# into an unrelated type/style cleanup project.
DISABLE_ERRORS_LINTERS:
  - PYTHON_PYLINT
  - PYTHON_MYPY

# Match both repository-relative and workspace-prefixed paths. Generated output
# and feeds-proxy are not maintained Feedseek source.
FILTER_REGEX_EXCLUDE: "((^|/)(feeds|cache|public|feeds-proxy)(/|$)|(^|/)assets/icons/|package-lock\\.json$)"
