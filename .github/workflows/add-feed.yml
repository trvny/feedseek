name: Add feed

# Fired by the Feed Catcher userscript via repository_dispatch.
# Appends an autodiscovered native feed to site/subscriptions.opml.

on:
  repository_dispatch:
    types: [add-feed]

permissions:
  contents: write

# Serialize concurrent taps so they don't race on the same file.
concurrency:
  group: add-feed
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      # this job commits & pushes back, so it needs persisted creds
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # No restorable cache: this job checks out with persisted
          # credentials and pushes to main, so a poisoned entry would run
          # with write access.
          enable-cache: false
          python-version: "3.14"
          working-directory: .

      - name: Append to subscriptions.opml
        env:
          FEED_URL: ${{ github.event.client_payload.feed_url }}
          FEED_TITLE: ${{ github.event.client_payload.title }}
          FEED_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          uv run --no-project python - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          MAX_URL_LEN = 2048
          MAX_TITLE_LEN = 200

          def checked_url(raw, label, *, optional=False):
              value = (raw or "").strip()
              if not value and optional:
                  return ""
              if not value:
                  raise SystemExit(f"missing {label}")
              if len(value) > MAX_URL_LEN:
                  raise SystemExit(f"{label} exceeds {MAX_URL_LEN} characters")
              if any(ord(ch) < 0x20 or ch.isspace() for ch in value):
                  raise SystemExit(f"{label} contains whitespace/control characters")
              parsed = urlsplit(value)
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  raise SystemExit(f"{label} must be an http(s) URL")
              if parsed.username is not None or parsed.password is not None:
                  raise SystemExit(f"{label} must not contain URL credentials")
              return value

          url = checked_url(os.environ.get("FEED_URL"), "feed_url")
          source = checked_url(os.environ.get("FEED_SOURCE"), "source", optional=True)
          supplied_title = (os.environ.get("FEED_TITLE") or "").strip()
          if supplied_title:
              title = " ".join(supplied_title.split())
              if len(title) > MAX_TITLE_LEN:
                  raise SystemExit(f"title exceeds {MAX_TITLE_LEN} characters")
          else:
              title = urlsplit(url).hostname or url
          if any(ord(ch) < 0x20 for ch in title):
              raise SystemExit("title contains control characters")

          p = Path("site/subscriptions.opml")
          if p.exists():
              tree = ET.parse(p)
              root = tree.getroot()
              body = root.find("body")
          else:
              root = ET.Element("opml", version="2.0")
              head = ET.SubElement(root, "head")
              ET.SubElement(head, "title").text = "trvny subscriptions"
              body = ET.SubElement(root, "body")
              tree = ET.ElementTree(root)

          if any(o.get("xmlUrl") == url for o in body.iter("outline")):
              print("already subscribed:", url); sys.exit(0)

          attrs = {"type": "rss", "text": title, "title": title, "xmlUrl": url}
          if source:
              attrs["htmlUrl"] = source
          ET.SubElement(body, "outline", attrs)

          ET.indent(tree, space="  ")
          p.parent.mkdir(parents=True, exist_ok=True)
          tree.write(p, encoding="utf-8", xml_declaration=True)
          print("added:", url)
          PY

      - name: Commit
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name  "feed-catcher[bot]"
          git config user.email "feed-catcher@users.noreply.github.com"
          git add site/subscriptions.opml
          git commit -m "subscriptions: add feed"
          for _ in 1 2 3; do
            git push && break
            echo "push rejected, rebasing"
            git pull --rebase origin main
          done
