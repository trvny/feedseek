# Codex-generated fixes for failed repository checks.
---
name: Codex auto-fix

on:  # yamllint disable-line rule:truthy
  # zizmor: ignore[dangerous-triggers] gated below to same-repo head refs, so no fork-controlled code is checked out
  workflow_run:
    workflows:
      - Android CI
      - Lint
      - Worker CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: codex-auto-fix-${{ github.event.workflow_run.run_id || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  fix_and_pr:
    # The workflow_run branch checks out the failing head SHA and then runs
    # repository tooling plus a Codex action holding OPENAI_API_KEY, with
    # contents:write. Restrict this to runs from this repository.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'failure' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout failed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Worker CI'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kanarek/worker/package-lock.json

      - name: Install Kanarek Worker dependencies
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Worker CI'
        run: npm ci
        working-directory: kanarek/worker

      - name: Install feeds-proxy dependencies
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Worker CI'
        run: npm install
        working-directory: feeds-proxy

      - name: Install uv and Python
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Lint'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-python: true

      - name: Install Feedseek dependencies
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Lint'
        run: uv sync
        working-directory: feedseek

      - name: Set up JDK 17
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Android CI'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Android CI'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            The repository workflow "${{ github.event.workflow_run.name || 'manual Codex auto-fix run' }}"
            failed for commit ${{ github.event.workflow_run.head_sha || github.sha }}.

            Reproduce only the relevant check:
            - Android CI: from `kanarek`, run
              `./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --stacktrace`.
            - Worker CI: from `kanarek/worker`, run `npm run typecheck` and `npm test`;
              from `feeds-proxy`, run `npm run typecheck`.
            - Lint: inspect the MegaLinter or TruffleHog failure. For Feedseek failures,
              from `feedseek` run `uv run python -m unittest discover -s tests` and
              `uv run feed_generators/validate_feeds.py`.

            Identify the minimal change needed to make the failing check pass, implement only that
            change, and rerun the smallest relevant command. Do not refactor unrelated files and
            do not modify generated feed/cache output unless the failed check specifically requires it.

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes and open PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_ID: ${{ github.event.workflow_run.run_id || github.run_id }}
        run: |
          branch="codex/auto-fix-$RUN_ID"

          git switch -c "$branch"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-fix failing checks via Codex"
          gh auth setup-git
          git push origin "$branch"

          {
            echo "Codex generated this patch after repository checks failed for \`$FAILED_HEAD_SHA\`."
            echo
            echo "Review the changes before merging."
          } > pr-body.md

          gh pr create \
            --base "$FAILED_HEAD_BRANCH" \
            --head "$branch" \
            --title "Auto-fix failing checks via Codex" \
            --body-file pr-body.md
