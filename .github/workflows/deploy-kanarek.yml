name: Deploy Kanarek

on:
  # zizmor: ignore[dangerous-triggers] gated below to successful main runs from this repository
  workflow_run:
    workflows: [Worker CI]
    types: [completed]
  push:
    branches: [main]
    paths: [.github/workflows/deploy-kanarek.yml]
  workflow_dispatch:

concurrency:
  group: deploy-kanarek
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: kanarek/worker
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kanarek/worker/package-lock.json

      - run: npm ci

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
