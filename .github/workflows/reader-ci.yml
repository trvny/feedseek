name: Reader CI

on:
  push:
    branches: [main]
    paths:
      - "site/reader.js"
      - "site/reader-fetch.js"
      - "site/reader.html"
      - "site/webmcp.js"
      - "site/test/**"
      - ".github/workflows/reader-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/reader.js"
      - "site/reader-fetch.js"
      - "site/reader.html"
      - "site/webmcp.js"
      - "site/test/**"
      - ".github/workflows/reader-ci.yml"
  workflow_dispatch:

concurrency:
  group: reader-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test reader
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Check reader
        run: |
          node --check site/reader.js
          node --check site/reader-fetch.js
          node --check site/webmcp.js
          node --test site/test/*.test.js
