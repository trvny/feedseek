---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore:
      - "cache/**"
  pull_request: null

permissions: {}

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MegaLinter, tests & secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # PR merge parent available; do not download the entire generated-feed history.
          fetch-depth: 2
          persist-credentials: false

      - name: Fetch missing comparison commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if [[ -z "$sha" || "$sha" =~ ^0+$ ]] || git cat-file -e "$sha^{commit}" 2>/dev/null; then
              continue
            fi
            if ! git fetch --no-tags --depth=1 origin "$sha"; then
              # A deleted push baseline is safe to handle by checking all instructions.
              if [[ "$GITHUB_EVENT_NAME" == "push" && "$sha" == "$BASE_SHA" ]]; then
                echo "::warning::Push baseline unavailable; Instruction Rot checks all tracked instructions"
                continue
              fi
              echo "::error::Missing PR comparison commit: $sha"
              exit 1
            fi
          done

      - name: Instruction Rot
        id: instruction_rot
        continue-on-error: true
        uses: trvny/.github/.github/actions/instruction-rot@9d3b98f7ceafd52aae0c707c1c667a1a8dedac0a
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect Feedseek changes
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tests=false
          artifacts=false
          if [ "$EVENT_NAME" = "push" ]; then
            tests=true
            artifacts=true
          else
            # Compare the exact PR base to GitHub's test merge commit.
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              Makefile pyproject.toml uv.lock feeds.yaml \
              feed_generators/ tests/ tools/ site/ docs/ \
              README.md README_pl.md; then
              tests=true
              artifacts=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              cache/; then
              artifacts=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              .github/workflows/mega-linter.yml \
              .github/linters/; then
              tests=true
            fi
          fi
          {
            echo "tests=$tests"
            echo "artifacts=$artifacts"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        if: steps.paths.outputs.tests == 'true' || steps.paths.outputs.artifacts == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.15"
          working-directory: .

      - name: Install Feedseek dependencies
        if: steps.paths.outputs.tests == 'true' || steps.paths.outputs.artifacts == 'true'
        run: uv sync --locked

      # Strict feeds.yaml gate (the runtime loader skips broken entries); fails fast.
      - name: Check feed registry
        if: steps.paths.outputs.tests == 'true'
        id: registry
        continue-on-error: true
        run: uv run --locked tools/check_registry.py

      # feeds/ is untracked; tests and validation use the last published pairs.
      - name: Restore published feeds from Pages
        if: steps.paths.outputs.tests == 'true' || steps.paths.outputs.artifacts == 'true'
        run: uv run --locked tools/restore_published_feeds.py

      - name: Test Feedseek
        if: steps.paths.outputs.tests == 'true'
        id: feedseek_tests
        continue-on-error: true
        run: uv run --locked python -m unittest discover -s tests

      # Only feeds not yet published (new in this PR) are generated here.
      - name: Bootstrap missing feed artifacts for PR validation
        if: github.event_name == 'pull_request' && steps.paths.outputs.artifacts == 'true'
        run: |
          uv run --locked python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("feed_generators").resolve()))
          from models import load_feed_registry
          from run_all_feeds import run_feed

          for name, config in load_feed_registry().items():
              if not config.enabled:
                  continue
              xml = Path("feeds") / f"feed_{name}.xml"
              sidecar = xml.with_suffix(".json")
              if not xml.exists() or not sidecar.exists():
                  print(f"Bootstrapping missing feed: {name}", flush=True)
                  if not run_feed(name, config, full=True):
                      raise SystemExit(1)
          PY

      - name: Validate feed artifacts
        if: steps.paths.outputs.artifacts == 'true'
        id: feed_artifacts
        continue-on-error: true
        run: uv run --locked feed_generators/validate_feeds.py

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/python@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
            }}
          APPLY_FIXES_EVENT: none
          # Never expose the shared LLM credential to code/config from pull requests.
          LLM_ADVISOR_ENABLED: ${{ github.event_name != 'pull_request' && secrets.ORCAROUTER_API_KEY != '' }}
          LLM_PROVIDER: orcarouter
          LLM_MODEL_NAME: orcarouter/auto
          ORCAROUTER_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ORCAROUTER_API_KEY || '' }}

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate feed registry
        if: >-
          always() &&
          steps.paths.outputs.tests == 'true' &&
          steps.registry.outcome != 'success'
        run: exit 1

      - name: Gate Feedseek tests
        if: >-
          always() &&
          steps.paths.outputs.tests == 'true' &&
          steps.feedseek_tests.outcome != 'success'
        run: exit 1

      - name: Gate feed artifacts
        if: >-
          always() &&
          steps.paths.outputs.artifacts == 'true' &&
          steps.feed_artifacts.outcome != 'success'
        run: exit 1

      - name: Gate MegaLinter
        if: always()
        env:
          MEGALINTER_OUTCOME: ${{ steps.megalinter.outcome }}
        run: |
          if [ "$MEGALINTER_OUTCOME" != "success" ]; then
            echo "MegaLinter reported blocking errors"
            exit 1
          fi

      - name: Gate Instruction Rot
        if: always() && steps.instruction_rot.outcome == 'failure'
        run: exit 1
