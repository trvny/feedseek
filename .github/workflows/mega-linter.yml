---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore:
      - "feedseek/feeds/**"
      - "feedseek/cache/**"
  pull_request: null

permissions: {}

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MegaLinter, tests & secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Feedseek changes
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tests=false
          artifacts=false
          companion=false
          if [ "$EVENT_NAME" = "push" ]; then
            tests=true
            artifacts=true
            companion=true
          else
            if ! git diff --quiet "$BASE_SHA" HEAD -- feedseek/; then
              tests=true
              artifacts=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              .github/workflows/mega-linter.yml \
              .github/linters/.mega-linter.yml; then
              tests=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              '.github/scripts/kanarek-companion*.cjs' \
              .github/workflows/kanarek-companion.yml; then
              companion=true
            fi
          fi
          {
            echo "tests=$tests"
            echo "artifacts=$artifacts"
            echo "companion=$companion"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Kanarek companion
        if: steps.paths.outputs.companion == 'true'
        run: |
          node --check .github/scripts/kanarek-companion.cjs
          node --check .github/scripts/kanarek-companion-quip.cjs
          node --check .github/scripts/kanarek-companion-view.cjs

      - name: Install uv and Python
        if: steps.paths.outputs.tests == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-python: true

      - name: Install Feedseek dependencies
        if: steps.paths.outputs.tests == 'true'
        working-directory: feedseek
        run: uv sync

      - name: Test Feedseek
        if: steps.paths.outputs.tests == 'true'
        id: feedseek_tests
        continue-on-error: true
        working-directory: feedseek
        run: uv run python -m unittest discover -s tests

      - name: Validate feed artifacts
        if: steps.paths.outputs.artifacts == 'true'
        id: feed_artifacts
        continue-on-error: true
        working-directory: feedseek
        run: uv run feed_generators/validate_feeds.py

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/python@v9
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
            }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none
          REPOSITORY_TRUFFLEHOG_ARGUMENTS: >-
            git file://.
            --since-commit
            ${{ github.event.pull_request.base.sha || github.event.before }}
            --branch
            ${{ github.event.pull_request.head.sha || github.event.after }}
            --fail
            --no-update
            --github-actions
            --results=verified,unknown

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate Feedseek tests
        if: >-
          always() &&
          steps.paths.outputs.tests == 'true' &&
          steps.feedseek_tests.outcome != 'success'
        run: exit 1

      - name: Gate feed artifacts
        if: >-
          always() &&
          steps.paths.outputs.artifacts == 'true' &&
          steps.feed_artifacts.outcome != 'success'
        run: exit 1

      - name: Gate MegaLinter
        if: always()
        env:
          MEGALINTER_OUTCOME: ${{ steps.megalinter.outcome }}
        run: |
          if [ "$MEGALINTER_OUTCOME" != "success" ]; then
            echo "MegaLinter reported blocking errors"
            exit 1
          fi
