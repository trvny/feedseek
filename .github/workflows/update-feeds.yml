name: Update Feeds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-feeds.yml"
      - ".github/workflows/deploy-pages.yml"
      - "feeds.yaml"
      - "site/**"
      - "assets/**"
      - "feed_generators/models.py"
      - "feed_generators/validate_feeds.py"
  schedule:
    - cron: "37 */2 * * *" # co 2 godziny
  workflow_dispatch:

concurrency:
  group: update-feeds
  cancel-in-progress: true

permissions: {}

env:
  FEEDSEEK_CACHE_BUCKET: feedseek-cache
  FEEDSEEK_CACHE_KEY: snapshots/cache.tar.gz
  FEEDSEEK_CACHE_MAX_BYTES: 134217728
  FEEDSEEK_GIT_SNAPSHOT_HOURS: "6"

jobs:
  update-feeds:
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 69
    outputs:
      pages_ready: ${{ steps.pages_upload.outcome == 'success' && steps.backup.outcome == 'success' && steps.model_feeds.outcome == 'success' && steps.validate.outcome == 'success' }}
    steps:
      - name: Checkout repository
        # zizmor: ignore[artipacked] this job commits & pushes feeds back, so it needs persisted creds
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # No restorable cache: this job checks out with persisted
          # credentials and pushes feeds to main, so a cache entry written from
          # a branch scope would be restored into a privileged run.
          # Cost is negligible either way: with the cache warm the setup and
          # sync steps took 4s of a 12m41s job, and a cold resolve is bounded
          # by downloading ten wheels. Generation dominates the runtime.
          enable-cache: false
          python-version: "3.14"
          working-directory: .

      - name: Install dependencies
        working-directory: .
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: feeds-proxy/package-lock.json

      - name: Install locked Wrangler
        working-directory: feeds-proxy
        run: npm ci

      - name: Restore Feedseek cache from R2
        id: restore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          uv run --locked tools/restore_r2_cache.py

      - name: Run feed tests
        working-directory: .
        run: make test

      - name: Generate feeds
        id: generate
        continue-on-error: true
        working-directory: .
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          THEYSAIDSO_API_KEY: ${{ secrets.THEYSAIDSO_API_KEY }}
          ANYCRAP_API_KEY: ${{ secrets.ANYCRAP_API_KEY }}
        run: uv run --locked feed_generators/run_all_feeds.py

      - name: Refresh LLM-friendly JSON feeds
        id: model_feeds
        continue-on-error: true
        working-directory: .
        run: uv run --locked feed_generators/model_feed.py

      - name: Validate feeds
        id: validate
        continue-on-error: true
        working-directory: .
        run: uv run --locked feed_generators/validate_feeds.py

      - name: Regenerate docs/sources.md
        continue-on-error: true
        working-directory: .
        run: uv run --locked feed_generators/docs_sources.py

      - name: Back up Feedseek cache to R2
        id: backup
        if: >-
          always() &&
          github.ref == 'refs/heads/main' &&
          steps.model_feeds.outcome == 'success' &&
          steps.validate.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run --locked tools/backup_r2_cache.py

      # Publish the freshly generated, validated pair without creating a Git commit.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build live Pages site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          uv run --locked site/build_site.py
          uv run --locked site/build_search_index.py
          uv run --locked site/make_favicon.py

      - name: Check live Model Feed catalog
        run: |
          test -s public/model-feeds.json
          uv run --locked python -m json.tool public/model-feeds.json > /dev/null
          grep -Fq 'model-feeds.json' public/llms.txt

      - name: Upload live Pages artifact
        id: pages_upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

      # Raw GitHub URLs keep working from main, but Git stores fewer snapshots.
      - name: Decide whether Git snapshot is due
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Non-scheduled refresh: snapshot immediately"
            exit 0
          fi

          # One path-filtered API read; avoid fetching the large Git history.
          if ! last="$(gh api "repos/$GITHUB_REPOSITORY/commits?path=feeds&per_page=1" --jq '.[0].commit.committer.date // empty')"; then
            echo "::warning::Could not read last feed commit; fail open to keep raw URLs fresh"
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$last" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now="$(date -u +%s)"
          last_epoch="$(date -u -d "$last" +%s)"
          age_seconds=$(( now - last_epoch ))
          if (( age_seconds >= FEEDSEEK_GIT_SNAPSHOT_HOURS * 3600 )); then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Git snapshot due (last: $last)"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Live Pages updated; Git snapshot deferred (last: $last)"
          fi

      - name: Commit and push successful updates
        if: >-
          always() &&
          !cancelled() &&
          github.ref == 'refs/heads/main' &&
          steps.model_feeds.outcome == 'success' &&
          steps.validate.outcome == 'success' &&
          steps.backup.outcome == 'success' &&
          steps.pages_upload.outcome == 'success' &&
          steps.snapshot.outputs.due == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add feeds docs/sources.md docs/model-feeds.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'Update feeds'
            if ! git push; then
              git pull --rebase
              uv run --locked feed_generators/docs_model_feeds.py
              git add docs/model-feeds.md
              if ! git diff --staged --quiet; then
                git commit -m 'Refresh Model Feed index'
              fi
              git push
            fi
          fi

      - name: Apply feed health gate
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          MODEL_FEEDS_OUTCOME: ${{ steps.model_feeds.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [ "$GENERATE_OUTCOME" != "success" ] || \
             [ "$MODEL_FEEDS_OUTCOME" != "success" ] || \
             [ "$VALIDATE_OUTCOME" != "success" ]; then
            echo "Feed, Model Feed, or validation generation reported failures; updates publish only after the full publication set passes."
            exit 1
          fi

  deploy-generated-pages:
    name: Deploy fresh feeds to GitHub Pages
    needs: update-feeds
    # Keep successful partial publications even when a generator health gate fails.
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.update-feeds.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: feedseek-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy live artifact
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
