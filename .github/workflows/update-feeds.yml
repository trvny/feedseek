name: Update Feeds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-feeds.yml"
  schedule:
    - cron: "37 */2 * * *" # co 2 godziny
  workflow_dispatch:

concurrency:
  group: update-feeds
  cancel-in-progress: true

permissions:
  contents: write

env:
  FEEDSEEK_CACHE_BUCKET: feedseek-cache
  FEEDSEEK_CACHE_KEY: snapshots/cache.tar.gz
  FEEDSEEK_CACHE_MAX_BYTES: 134217728

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 69
    steps:
      - name: Checkout repository
        # zizmor: ignore[artipacked] this job commits & pushes feeds back, so it needs persisted creds
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # No restorable cache: this job checks out with persisted
          # credentials and pushes feeds to main, so a cache entry written from
          # a branch scope would be restored into a privileged run.
          # Cost is negligible either way: with the cache warm the setup and
          # sync steps took 4s of a 12m41s job, and a cold resolve is bounded
          # by downloading ten wheels. Generation dominates the runtime.
          enable-cache: false
          python-version: "3.14"
          working-directory: .

      - name: Install dependencies
        working-directory: .
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve latest stable Wrangler 4
        id: wrangler
        run: |
          version="$(npm view 'wrangler@>=4 <5' version --json | uv run --no-project python -c \
            'import json, sys; value=json.load(sys.stdin); print(value[-1] if isinstance(value, list) else value)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "WRANGLER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-wrangler-${{ steps.wrangler.outputs.version }}

      - name: Prepare R2 cache bucket
        id: r2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials unavailable; using the repository cache seed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response="$RUNNER_TEMP/r2-buckets.json"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets?per_page=1000" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$response"

          exists="$(uv run --no-project python - "$response" "$FEEDSEEK_CACHE_BUCKET" <<'PY'
          import json
          import sys

          path, bucket = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          if not data.get("success"):
              raise SystemExit("Cloudflare bucket listing failed")
          print("true" if any(item.get("name") == bucket for item in data.get("result", {}).get("buckets", [])) else "false")
          PY
          )"

          if [ "$exists" != "true" ]; then
            create_response="$RUNNER_TEMP/r2-create.json"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --request POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"$FEEDSEEK_CACHE_BUCKET\"}" \
              --output "$create_response"
            uv run --no-project python - "$create_response" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not data.get("success"):
              raise SystemExit("Cloudflare bucket creation failed")
          PY
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Restore Feedseek cache from R2
        if: steps.r2.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/feedseek-cache.tar.gz"
          restore_dir="$(mktemp -d)"
          trap 'rm -rf "$restore_dir"' EXIT

          if npx --yes "wrangler@$WRANGLER_VERSION" r2 object get \
            "$FEEDSEEK_CACHE_BUCKET/$FEEDSEEK_CACHE_KEY" \
            --file "$archive" \
            --remote && \
            uv run --locked tools/restore_cache_archive.py \
              "$archive" "$restore_dir" --merge-into cache; then
            echo "Merged Feedseek cache from R2 without replacing newer repository state."
          else
            echo "::warning::No usable R2 snapshot yet; using the repository cache seed."
          fi

      - name: Run feed tests
        working-directory: .
        run: uv run --locked python -m unittest discover -s tests

      - name: Generate feeds
        id: generate
        continue-on-error: true
        working-directory: .
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          THEYSAIDSO_API_KEY: ${{ secrets.THEYSAIDSO_API_KEY }}
          ANYCRAP_API_KEY: ${{ secrets.ANYCRAP_API_KEY }}
        run: uv run --locked feed_generators/run_all_feeds.py

      - name: Validate feeds
        id: validate
        continue-on-error: true
        working-directory: .
        run: uv run --locked feed_generators/validate_feeds.py

      - name: Regenerate docs/sources.md
        continue-on-error: true
        working-directory: .
        run: uv run --locked feed_generators/docs_sources.py

      - name: Back up Feedseek cache to R2
        if: >-
          always() &&
          github.ref == 'refs/heads/main' &&
          steps.r2.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/feedseek-cache.tar.gz"
          cache_bytes="$(find cache -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')"
          if [ "$cache_bytes" -gt "$FEEDSEEK_CACHE_MAX_BYTES" ]; then
            echo "::warning::Feedseek cache is $cache_bytes bytes; keeping the existing R2 snapshot (limit: $FEEDSEEK_CACHE_MAX_BYTES)."
            exit 0
          fi

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$archive" \
            -C . cache
          npx --yes "wrangler@$WRANGLER_VERSION" r2 object put \
            "$FEEDSEEK_CACHE_BUCKET/$FEEDSEEK_CACHE_KEY" \
            --file "$archive" \
            --content-type application/gzip \
            --remote

      - name: Commit and push successful updates
        if: >-
          always() &&
          !cancelled() &&
          github.ref == 'refs/heads/main' &&
          steps.validate.outcome == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add feeds cache docs/sources.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'Update feeds'
            git push || { git pull --rebase && git push; }
          fi

      - name: Apply feed health gate
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [ "$GENERATE_OUTCOME" != "success" ] || \
             [ "$VALIDATE_OUTCOME" != "success" ]; then
            echo "Feed generation or validation reported failures; updates publish only after final validation passes."
            exit 1
          fi
