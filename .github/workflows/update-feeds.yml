name: Update Feeds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-feeds.yml"
  schedule:
    - cron: "37 */2 * * *" # co 2 godziny
  workflow_dispatch:

concurrency:
  group: update-feeds
  cancel-in-progress: true

permissions:
  contents: write

env:
  FEEDSEEK_CACHE_BUCKET: feedseek-cache
  FEEDSEEK_CACHE_KEY: snapshots/cache.tar.gz
  FEEDSEEK_CACHE_MAX_BYTES: 134217728

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 69
    steps:
      - name: Checkout repository
        # zizmor: ignore[artipacked] this job commits & pushes feeds back, so it needs persisted creds
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # No restorable cache: this job checks out with persisted
          # credentials and pushes feeds to main, so a cache entry written from
          # a branch scope would be restored into a privileged run.
          # Cost is negligible either way: with the cache warm the setup and
          # sync steps took 4s of a 12m41s job, and a cold resolve is bounded
          # by downloading ten wheels. Generation dominates the runtime.
          enable-cache: false
          python-version: "3.14"
          working-directory: .

      - name: Install dependencies
        working-directory: .
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: feeds-proxy/package-lock.json

      - name: Install locked Wrangler
        working-directory: feeds-proxy
        run: npm ci

      - name: Restore Feedseek cache from R2
        id: restore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          uv run --locked tools/restore_r2_cache.py

      - name: Run feed tests
        working-directory: .
        run: uv run --locked python -m unittest discover -s tests

      - name: Generate feeds
        id: generate
        continue-on-error: true
        working-directory: .
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          THEYSAIDSO_API_KEY: ${{ secrets.THEYSAIDSO_API_KEY }}
          ANYCRAP_API_KEY: ${{ secrets.ANYCRAP_API_KEY }}
        run: uv run --locked feed_generators/run_all_feeds.py

      - name: Validate feeds
        id: validate
        continue-on-error: true
        working-directory: .
        run: uv run --locked feed_generators/validate_feeds.py

      - name: Regenerate docs/sources.md
        continue-on-error: true
        working-directory: .
        run: uv run --locked feed_generators/docs_sources.py

      - name: Back up Feedseek cache to R2
        id: backup
        if: >-
          always() &&
          github.ref == 'refs/heads/main' &&
          steps.validate.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run --locked tools/backup_r2_cache.py

      - name: Commit and push successful updates
        if: >-
          always() &&
          !cancelled() &&
          github.ref == 'refs/heads/main' &&
          steps.validate.outcome == 'success' &&
          steps.backup.outcome == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add feeds docs/sources.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'Update feeds'
            git push || { git pull --rebase && git push; }
          fi

      - name: Apply feed health gate
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [ "$GENERATE_OUTCOME" != "success" ] || \
             [ "$VALIDATE_OUTCOME" != "success" ]; then
            echo "Feed generation or validation reported failures; updates publish only after final validation passes."
            exit 1
          fi
