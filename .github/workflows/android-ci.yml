name: Android CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths: ["kanarek/**", "!kanarek/worker/**"]
  pull_request:
    branches: [main]
    paths: ["kanarek/**", "!kanarek/worker/**"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: kanarek
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.6.0
          fi

      - name: Build, test & lint
        id: checks
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assemblePlayDebug assembleFossDebug testPlayDebugUnitTest lintPlayDebug --stacktrace 2>&1 | tee responsive-check.log

      - name: Save failure diagnostic
        if: steps.checks.outcome == 'failure'
        working-directory: .
        run: |
          {
            grep -E '(^e: |error:|FAILED|FAILURE:|Execution failed|There were failing tests|Caused by:|AssertionError|IllegalArgumentException|RuntimeException)' kanarek/responsive-check.log || true
            echo '--- tail ---'
            tail -n 220 kanarek/responsive-check.log
          } > .ci-widget-responsive-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-widget-responsive-error.txt
          git commit -m "ci: capture responsive widget failure [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Apply check gate
        if: steps.checks.outcome == 'failure'
        run: exit 1
