---
name: Feed tool benchmarks
on: # yamllint disable-line rule:truthy
  workflow_dispatch: null
  pull_request:
    paths:
      - "tools/benchmark_feed_tools.py"
      - ".github/workflows/feed-tool-benchmarks.yml"

permissions: {}

jobs:
  benchmark:
    name: Benchmark ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: fastfeedparser
            requirement: fastfeedparser==0.6.5
          - package: feedparser-rs
            requirement: feedparser-rs==0.7.1
          - package: selectolax
            requirement: selectolax==1.0.2
          - package: trafilatura
            requirement: trafilatura==2.3.1
          - package: rtrafilatura
            requirement: rtrafilatura==0.2.0
          - package: feed-seeker
            requirement: feed-seeker==2.0.0
          - package: feedsearch-crawler
            requirement: feedsearch-crawler==2.1.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Compare on real sources
        env:
          PACKAGE: ${{ matrix.package }}
          REQUIREMENT: ${{ matrix.requirement }}
        run: |
          set -o pipefail
          uv run --no-project --python 3.15 \
            --with "$REQUIREMENT" --with "feedparser>=6.0.12" \
            --with "beautifulsoup4>=4.12" --with "lxml>=6.1.1" \
            tools/benchmark_feed_tools.py "$PACKAGE" | tee -a "$GITHUB_STEP_SUMMARY"
