name: Deploy Pages

on:
  # Automatic production deploys come from Update Feeds with live, validated files.
  # Manual rebuild remains a fallback using the last Git snapshot.
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "feeds.yaml"
      - "tests/test_build_site_favicons.py"
      - "feed_generators/models.py"
      - "feed_generators/validate_feeds.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/update-feeds.yml"
      - "tests/test_update_feeds_workflow.py"
  workflow_dispatch:
  # Only for a failed source/site push. Do not overwrite a successful live deploy.
  # zizmor: ignore[dangerous-triggers] trusted default-branch checkout, no PR code
  workflow_run:
    workflows: ["Update Feeds"]
    types: [completed]

permissions:
  contents: read
concurrency:
  # PR checks must not cancel production deploys.
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-pr:
    name: PR site checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Test site contracts
        run: uv run --locked python -m unittest discover -s tests -p 'test_build_site_favicons.py'

      - name: Test publishing workflow contracts
        run: uv run --locked python -m unittest discover -s tests -p 'test_update_feeds_workflow.py'

      - name: Build site
        env:
          SITE_URL: https://trvny.github.io/feedseek/
        run: |
          uv run --locked site/build_site.py
          uv run --locked site/build_search_index.py
          uv run --locked site/make_favicon.py

      - name: Check generated catalog
        run: |
          test -s public/model-feeds.json
          uv run --locked python -m json.tool public/model-feeds.json > /dev/null
          grep -Fq 'model-feeds.json' public/llms.txt

  check-fallback:
    name: Check whether live Pages already deployed
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-slim
    permissions:
      actions: read
    outputs:
      allowed: ${{ steps.inspect.outputs.allowed }}
    steps:
      - name: Check generator workflow jobs
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if ! conclusions="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" --jq '.jobs[] | select(.name == "Deploy fresh feeds to GitHub Pages") | .conclusion')"; then
            echo "::warning::Could not confirm live deployment; skip potentially stale fallback"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qx success <<< "$conclusions"; then
            echo "Live Pages already deployed; keep the fresher artifact"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful live deploy; publish the trusted Git snapshot fallback"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

  build-deploy:
    needs: check-fallback
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && needs.check-fallback.outputs.allowed == 'true'))
    concurrency:
      group: feedseek-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    # Emergency rebuild from the last committed snapshot, not the live R2 state.
    runs-on: ubuntu-slim
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # No restorable cache: this job builds the artifact that
          # actions/deploy-pages publishes, and cache entries written on a
          # branch are readable here. Same reasoning as deploy-cloudflare-pages.
          enable-cache: false
          python-version: "3.14"
          working-directory: .

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Test site contracts
        run: uv run --locked python -m unittest discover -s tests -p 'test_build_site_favicons.py'

      - name: Build site
        working-directory: .
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          uv run --locked site/build_site.py
          uv run --locked site/build_search_index.py
          uv run --locked site/make_favicon.py

      - name: Check generated catalog
        run: |
          test -s public/model-feeds.json
          uv run --locked python -m json.tool public/model-feeds.json > /dev/null
          grep -Fq 'model-feeds.json' public/llms.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
