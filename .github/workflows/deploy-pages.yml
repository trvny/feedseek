name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  # zizmor: ignore[dangerous-triggers] deploy-after-build on our own workflow; checks out default ref, no untrusted PR code
  workflow_run:
    workflows: ["Update Feeds"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    # Update Feeds publishes successful partial output before applying its health gate,
    # so deploy after every completed run and always build from the current default branch.
    runs-on: ubuntu-slim
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        working-directory: .
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 site/build_site.py
          python3 site/make_favicon.py
          sed -i '/google-site-verification/a\  <meta name="msvalidate.01" content="23A368B2C5F4DF3471A67EA6CB057149" />' public/index.html

      - name: Generate subscriptions.opml
        working-directory: .
        run: python3 site/make_opml.py

      - name: Add live reader
        working-directory: .
        run: |
          mkdir -p public/reader
          cp site/reader.html public/reader/index.html
          cp site/reader-fetch.js public/reader/reader-fetch.js
          cp site/reader.js public/reader/reader.js
          cp public/favicon.svg public/reader/favicon.svg
          cp public/favicon.ico public/reader/favicon.ico
          cp public/site.webmanifest public/reader/site.webmanifest
          cp -r public/icons public/reader/icons

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
