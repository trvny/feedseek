name: Release
on: # yamllint disable-line rule:truthy
  push:
    tags: ["kanarek-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing kanarek-v* tag to publish
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanarek
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$DISPATCH_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if ! printf '%s\n' "$release_tag" | grep -Eq '^kanarek-v[0-9A-Za-z][0-9A-Za-z._-]*$'; then
            echo "::error::Release tag must match kanarek-v* and contain only letters, digits, dots, underscores, or hyphens."
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#kanarek-v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
          cache-disabled: true # release build must not trust a poisonable cache

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.1

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot produce a signed release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK to kanarek-<version>
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mv app/build/outputs/apk/play/release/app-play-release.apk \
             "app/build/outputs/apk/play/release/kanarek-${RELEASE_VERSION}.apk"
          mv app/build/outputs/apk/foss/release/app-foss-release.apk \
             "app/build/outputs/apk/foss/release/kanarek-${RELEASE_VERSION}-foss.apk"

      - name: Publish release with APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: kanarek/app/build/outputs/apk/*/release/kanarek-*.apk
          generate_release_notes: true
