name: Worker CI

# Check only. Production deployment of feeds-proxy is already owned by
# Cloudflare Workers Builds from feeds-proxy/ on main.
on:
  push:
    branches: [main]
    paths:
      - "feeds-proxy/**"
      - "!feeds-proxy/**/*.md"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "feeds-proxy/**"
      - "!feeds-proxy/**/*.md"
      - ".github/workflows/worker-ci.yml"
  workflow_dispatch:

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check feeds-proxy
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: feeds-proxy/package-lock.json

      - name: Check feeds-proxy
        working-directory: feeds-proxy
        run: |
          npm ci
          npm run check
