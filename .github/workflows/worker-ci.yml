name: Worker CI

on:
  push:
    branches: [main]
    paths:
      - "kanarek/worker/**"
      - "feeds-proxy/**"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "kanarek/worker/**"
      - "feeds-proxy/**"
      - ".github/workflows/worker-ci.yml"

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kanarek/worker/package-lock.json

      - name: Check Kanarek Worker
        working-directory: kanarek/worker
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Check feeds-proxy
        working-directory: feeds-proxy
        run: |
          npm install
          npm run typecheck
