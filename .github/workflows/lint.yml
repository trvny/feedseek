---
name: Lint

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore:
      - "feedseek/feeds/**"
      - "feedseek/cache/**"
  pull_request: null

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MegaLinter, tests & secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Install Feedseek dependencies
        working-directory: feedseek
        run: uv sync

      - name: Check Feedseek
        id: feedseek
        continue-on-error: true
        working-directory: feedseek
        run: |
          uv run python -m unittest discover -s tests
          uv run feed_generators/validate_feeds.py

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/python@v9
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
            }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none
          APPLY_FIXES_MODE: commit

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log

      - name: Secret scanning
        id: secret_scan
        continue-on-error: true
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - name: Save check outcomes
        if: always()
        env:
          FEEDSEEK_OUTCOME: ${{ steps.feedseek.outcome }}
          MEGALINTER_OUTCOME: ${{ steps.megalinter.outcome }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
        run: |
          printf 'feedseek=%s\nmegalinter=%s\nsecret_scan=%s\n' \
            "$FEEDSEEK_OUTCOME" "$MEGALINTER_OUTCOME" "$SECRET_SCAN_OUTCOME" \
            > .ci-lint-outcomes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-lint-outcomes.txt
          git commit -m "ci: capture lint outcomes [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Apply check gate
        if: always()
        env:
          FEEDSEEK_OUTCOME: ${{ steps.feedseek.outcome }}
          MEGALINTER_OUTCOME: ${{ steps.megalinter.outcome }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
        run: |
          failed=0
          for outcome in "$FEEDSEEK_OUTCOME" "$MEGALINTER_OUTCOME" "$SECRET_SCAN_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
