name: Cleanup stale X changelog reference

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_cleanup-stale-x-changelog.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Remove stale grouping key
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('feed_generators/docs_sources.py')
          text = path.read_text(encoding='utf-8')
          old = ', "creativecommons", "x_changelog"]),'
          new = ', "creativecommons"]),'
          if old not in text:
              raise SystemExit('stale x_changelog grouping key not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/_cleanup-stale-x-changelog.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add feed_generators/docs_sources.py
          git commit -m "chore: remove stale X changelog reference"
          git push
