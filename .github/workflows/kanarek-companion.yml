---
name: kanarek

on: # yamllint disable-line rule:truthy
  # zizmor: ignore[dangerous-triggers] only same-repository PRs call the trusted reusable workflow
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - auto_merge_enabled
      - auto_merge_disabled
      - closed
  pull_request_review:
    types:
      - submitted
      - dismissed
  # zizmor: ignore[dangerous-triggers] only PR runs from this repository are accepted
  workflow_run:
    workflows:
      - Android CI
      - MegaLinter
      - Worker CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: One PR to refresh; 0 refreshes all open PRs
        required: false
        default: 0
        type: number

permissions: {}

jobs:
  companion:
    if: >-
      ${{
        vars.KANAREK_ENABLED != 'false' &&
        (github.event_name != 'pull_request_target' ||
         github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'pull_request_review' ||
         github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'workflow_run' ||
         (github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
      }}
    concurrency:
      group: >-
        kanarek-${{ github.repository }}-${{
          github.event.pull_request.number ||
          github.event.workflow_run.pull_requests[0].number ||
          github.event.workflow_run.head_sha ||
          github.run_id
        }}
      cancel-in-progress: true
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    uses: trvny/.github/.github/workflows/kanarek-companion.yml@main
    with:
      watched_workflows: Android CI,MegaLinter,Worker CI
      ai_enabled: ${{ vars.KANAREK_AI_ENABLED != 'false' }}
      quip_bank_enabled: ${{ vars.KANAREK_QUIP_BANK_ENABLED != 'false' }}
      ai_percent: ${{ fromJSON(vars.KANAREK_AI_PERCENT || '25') }}
      quip_kv_namespace_id: ${{ vars.KANAREK_QUIP_KV_NAMESPACE_ID || '1534e989ac23449fab8e18abc2bc250d' }}
      openai_model: ${{ vars.KANAREK_OPENAI_MODEL || 'gpt-5-nano' }}
      openai_fallback_model: ${{ vars.KANAREK_OPENAI_FALLBACK_MODEL || 'gpt-4.1-nano' }}
      anthropic_model: ${{ vars.KANAREK_ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
      gemini_model: ${{ vars.KANAREK_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      xai_model: ${{ vars.KANAREK_XAI_MODEL || 'grok-4.5' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
