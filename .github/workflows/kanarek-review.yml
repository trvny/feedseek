name: Kanarek free review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
      head_sha:
        description: Exact pull request head SHA
        required: true
        type: string
      base_sha:
        description: Base SHA captured for the review
        required: true
        type: string
      provider:
        description: Review provider for manual runs
        required: true
        default: openrouter
        type: choice
        options: [openrouter, orca]

permissions: {}

concurrency:
  group: kanarek-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  openrouter:
    if: >-
      ${{
        ((github.event_name == 'workflow_dispatch' && inputs.provider == 'openrouter') ||
          (github.event_name == 'pull_request' && github.event.action == 'opened')) &&
        (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft) &&
        (github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: trvny/trvny/.github/workflows/kanarek-review-openrouter-worker.lock.yml@main
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}
      head_sha: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
      base_sha: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  orca:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.provider == 'orca' }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: trvny/trvny/.github/workflows/kanarek-review-worker.lock.yml@main
    with:
      pr_number: ${{ format('{0}', inputs.pr_number) }}
      head_sha: ${{ inputs.head_sha }}
      base_sha: ${{ inputs.base_sha }}
    secrets:
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  aihubmix-glm:
    if: >-
      ${{
        github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # Keep this on the squash-merged commit so branch cleanup cannot break resolution.
    uses: trvny/trvny/.github/workflows/kanarek-review-aihubmix-worker.lock.yml@e38e4bbc69f5fa175ebacfbffcd16859fc16c0c1
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
    secrets:
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
